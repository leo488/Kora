<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      /* The viewport. On a phone that chose the desktop view (see
         components/DesktopViewNotice.tsx) the page lays out 1280 px wide and
         the browser zooms it to fit; otherwise the usual phone width. Written
         while the page parses, so every browser reads it as the page's own. */
      ;(function () {
        var desktop = false
        try {
          desktop = localStorage.getItem('kora-view') === 'desktop' && Math.min(screen.width, screen.height) <= 760
        } catch (e) {}
        document.write('<meta name="viewport" content="' + (desktop ? 'width=1280' : 'width=device-width, initial-scale=1.0') + '" />')
        if (desktop) document.documentElement.classList.add('kora-desktop-view')
      })()
    </script>
    <noscript><meta name="viewport" content="width=device-width, initial-scale=1.0" /></noscript>
    <!-- Tints the browser UI on Android to match the intro and contact band. -->
    <meta name="theme-color" content="#1A2DB7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@300..800&family=Barlow+Condensed:wght@800&family=Noto+Sans+SC:wght@500;900&family=Inter+Tight:wght@700&family=DM+Mono&family=DM+Sans:opsz,wght@9..40,400..700&display=swap"
      rel="stylesheet"
    />
    <title>Koraa’</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
